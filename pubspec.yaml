name: talkora_ai
description: Nimo v4.0 Ultra Edition (YOSSEF JOO Edition) — Liquid Glass UI, Realistic Human Voice AI, Key-Based Image Studio, Coding Lab Pro, 4,300+ Offline Knowledge DB & Latest 2026 AI Models.
publish_to: "none"
version: 4.0.0+4

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  dio: ^5.7.0
  web_socket_channel: ^3.0.1
  record: ^7.0.0
  just_audio: ^0.9.42
  audio_session: ^0.1.23
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.3
  intl: any
  connectivity_plus: ^6.1.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/db/
