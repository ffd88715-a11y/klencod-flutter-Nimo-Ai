services:
  api:
    build: .
    container_name: talkora_api
    ports:
      - "8000:8000"
    environment:
      TALKORA_ENV: production
      TALKORA_SECRET_KEY: ${TALKORA_SECRET_KEY:-change-this-secret-in-production}
      DATABASE_URL: postgresql://talkora:talkora_pass@postgres:5432/talkora
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      TALKORA_LLM_PROVIDER: llama_cpp
      TALKORA_LLM_URL: http://llm:8080/v1
      TALKORA_LLM_MODEL: Qwen3-8B-Instruct-Q4_K_M
      TALKORA_STT_PROVIDER: faster_whisper
      TALKORA_TTS_PROVIDER: qwen3_tts
    depends_on:
      - postgres
      - qdrant
      - redis
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: talkora_postgres
    environment:
      POSTGRES_USER: talkora
      POSTGRES_PASSWORD: talkora_pass
      POSTGRES_DB: talkora
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./app/database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    ports:
      - "5432:5432"
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.5
    container_name: talkora_qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: talkora_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  # Self-hosted OpenAI-compatible LLM inference via llama.cpp (MIT)
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: talkora_llm
    profiles: ["ai-cpu", "ai-gpu"]
    volumes:
      - ./models/llm:/models:ro
    command: ["-m", "/models/Qwen3-8B-Instruct-Q4_K_M.gguf", "--host", "0.0.0.0", "--port", "8080", "-c", "4096"]
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  pg_data:
  qdrant_data:
